quot;, &quot;options&quot;: [[1, &quot;Taenia solium&quot;], [2, &quot;Taeniarhynchus saginatus&quot;], [3, &quot;Fasciola hepatica&quot;], [4, &quot;Hymenolepis nana&quot;], [5, &quot;Alveococcus multilocularis&quot;]], &quot;answer&quot;: 1, &quot;duplicate&quot;: false}, {&quot;source_num&quot;: 477, &quot;question&quot;: &quot;Ребенок беспокойно спит, во сне скрипит зубами, часто расчесывает область анального отверстия. При осмотре выявлены гельминты длиной до 1 см, нитевидной формы, белого цвета. Определите вид гельминта&quot;, &quot;options&quot;: [[1, &quot;кривоголовка&quot;], [2, &quot;трихинелла&quot;], [3, &quot;аскарида&quot;], [4, &quot;острица&quot;], [5, &quot;власоглав&quot;]], &quot;answer&quot;: 1, &quot;duplicate&quot;: false}, {&quot;source_num&quot;: 478, &quot;question&quot;: &quot;При дегельминтизации у больного выявлены длинные фрагменты гельминта, который имеет членистое строение. Ширина члеников превышает длину, в центре членика выявлено розеткоподобной формы образование. Определите вид гельминта&quot;, &quot;options&quot;: [[1, &quot;широкий лентец&quot;], [2, &quot;карликовый цепень&quot;], [3, &quot;альвеококк&quot;], [4, &quot;цепень невооруженный&quot;], [5, &quot;цепень вооруженный&quot;]], &quot;answer&quot;: 1, &quot;duplicate&quot;: false}, {&quot;source_num&quot;: 479, &quot;question&quot;: &quot;Больной жалуется на слабость, снижение трудоспособности, головную боль, тошноту, слюнотечение, боль в желудке. При исследовании крови выявлены признаки малокровия. При копрологическом исследовании выявлены яйца серого цвета с крышечкой на верхнем полюсе и с бугорком на противоположной стороне. Поставьте диагноз.&quot;, &quot;options&quot;: [[1, &quot;описторхоз&quot;], [2, &quot;тениоз&quot;], [3, &quot;тениаринхоз&quot;], [4, &quot;фасциолез&quot;], [5, &quot;дифиллоботриоз&quot;]], &quot;answer&quot;: 1, &quot;duplicate&quot;: false}, {&quot;source_num&quot;: 480, &quot;question&quot;: &quot;У больного ребенка периодически появляются жидкие испражнения, иногда боль в области живота, тошнота, рвота. По рассказам матери, однажды у ребенка с рвотной массой выделился гельминт цилиндрической формы, размером 20 см. Причиной такого состояния может быть:&quot;, &quot;options&quot;: [[1, &quot;трихоцефалез&quot;], [2, &quot;анкилостомоз&quot;], [3, &quot;трихинеллез&quot;], [4, &quot;аскаридоз&quot;], [5, &quot;дракункулез&quot;]], &quot;answer&quot;: 1, &quot;duplicate&quot;: false}, {&quot;source_num&quot;: 481, &quot;question&quot;: &quot;Мать нашла у 5-летней дочери на перианальных складках белых “червячков”, что вызывали у нее зуд и беспокойство, и доставила их в лабораторию. При осмотре врач увидел белых гельминтов 0,5-1 см длиной, нитевидной формы с заостренными концами. Какой диагноз можно поставить?&quot;, &quot;options&quot;: [[1, &quot;тениоз&quot;], [2, &quot;дифиллоботриоз&quot;], [3, &quot;энтеробиоз&quot;], [4, &quot;аскаридоз&quot;], [5, &quot;описторхоз&quot;]], &quot;answer&quot;: 1, &quot;duplicate&quot;: false}, {&quot;source_num&quot;: 482, &quot;question&quot;: &quot;Работница животноводческой фермы обратилась к врачу с жалобами на расстройства процессов пищеварения. Врач поставил диагноз “Эхинококкоз печени”. Диагноз был подтвержден при оперативном вмешательстве. От какого животного больная могла заразиться эхинококкозом?&quot;, &quot;options&quot;: [[1, &quot;кролик&quot;], [2, &quot;свинья&quot;], [3, &quot;собака&quot;], [4, &quot;кошка&quot;], [5, &quot;корова&quot;]], &quot;answer&quot;: 1, &quot;duplicate&quot;: false}, {&quot;source_num&quot;: 483, &quot;question&quot;: &quot;При микроскопии мокроты больного пневмонией обнаружены личинки. При анализе крови выявлена эозинофилия. Какой гельминтоз можно предположить?&quot;, &quot;options&quot;: [[1, &quot;энтеробиоз&quot;], [2, &quot;трихоцефалез&quot;], [3, &quot;аскаридоз&quot;], [4, &quot;парагонимоз&quot;], [5, &quot;описторхоз&quot;]], &quot;answer&quot;: 1, &quot;duplicate&quot;: false}, {&quot;source_num&quot;: 484, &quot;question&quot;: &quot;В больницу поступил больной с жалобами на головную боль, боль в мышцах во время движения, боль при глотании, жевании и вращении глаз, слабость, температуру, отек век и лица. При обследовании больного выяснилось, что он ел свинину, купленную у частных лиц. Какой вид гельминтоза можно предположить?&quot;, &quot;options&quot;: [[1, &quot;аскаридоз&quot;], [2, &quot;трихоцефалез&quot;], [3, &quot;трихинеллез&quot;], [4, &quot;анкилостомоз&quot;], [5, &quot;цистицеркоз&quot;]], &quot;answer&quot;: 1, &quot;duplicate&quot;: false}, {&quot;source_num&quot;: 485, &quot;question&quot;: &quot;В фекалиях больного с расстройствами пищеварения выявлены членики цепня; матка имеет 7-12 боковых ответвлений. Определите вид гельминта&quot;, &quot;options&quot;: [[1, &quot;эхинококк&quot;], [2, &quot;лентец широкий&quot;], [3, &quot;цепень карликовый&quot;], [4, &quot;цепень вооруженный&quot;], [5, &quot;цепень невооруженный&quot;]], &quot;answer&quot;: 1, &quot;duplicate&quot;: false}, {&quot;source_num&quot;: 486, &quot;question&quot;: &quot;При микроскопии мазка фекалий школьника выявлены коричневого цвета яйца с бугорчатой оболочкой. Какому гельминту они принадлежат?&quot;, &quot;options&quot;: [[1, &quot;острица&quot;], [2, &quot;аскарида&quot;], [3, &quot;власоглав&quot;], [4, &quot;цепень карликовый&quot;], [5, &quot;лентец широкий&quot;]], &quot;answer&quot;: 1, &quot;duplicate&quot;: false}, {&quot;source_num&quot;: 487, &quot;question&quot;: &quot;В фекалиях больного с расстройствами пищеварения, злокачественной анемией выявлены членики цепня с розетковидной маткой. Какое заболевание это может быть?&quot;, &quot;options&quot;: [[1, &quot;тениоз&quot;], [2, &quot;тениаринхоз&quot;], [3, &quot;гименолепидоз&quot;], [4, &quot;дифиллоботриоз&quot;], [5, &quot;эхинококкоз&quot;]], &quot;answer&quot;: 1, &quot;duplicate&quot;: false}, {&quot;source_num&quot;: 488, &quot;question&quot;: &quot;У пациента, который приехал из Африки, появилась кровь в моче. При м function choose(btn,n){
 if(answered)return; answered=true;

 });

}
